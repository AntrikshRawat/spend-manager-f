<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Standard SEO Meta Tags -->
    <meta
      name="description"
      content="Spend Manager is an intuitive expense-sharing and budget-tracking application. Effortlessly track your personal spending, split bills, and manage shared expenses."
    />
    <meta
      name="keywords"
      content="spend manager, expense tracker, split bills, budget management, personal finance, expense sharing, finance app"
    />
    <meta name="author" content="Antriksh Rawat" />

    <!-- Theme color for mobile browser UI -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph (OG) Tags for Social Media (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Spend Manager - Track & Share Expenses Easily"
    />
    <meta
      property="og:description"
      content="Effortlessly track your personal spending and split bills with friends using Spend Manager."
    />
    <meta property="og:url" content="https://spend-manager-f.vercle.app" />
    <meta property="og:site_name" content="Spend Manager" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Spend Manager - Track & Share Expenses Easily"
    />
    <meta
      name="twitter:description"
      content="Effortlessly track your personal spending and split bills with friends using Spend Manager."
    />
    <meta
      name="twitter:image"
      content="https://www.your-domain.com/logo-192x192.png"
    />

    <!-- Icons and Manifest -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-192x192.png"
      sizes="192x192"
    />
    <link rel="apple-touch-icon" href="/logo-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend Manager | Expense Tracking & Bill Splitting</title>
